# Produce a reproducible, installable Android *preview* APK from the Chinese branch.
# This does NOT claim stable signing or on-device QA: debug keys may vary by run.
name: Publish Myspoti Chinese preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-zh-cn-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-myspoti-zh-cn
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: i18n/zh-hans
          fetch-depth: 0

      - name: Show exactly which Chinese source revision is built
        run: |
          echo "CHINESE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Source: $(git rev-parse HEAD)"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify zh-CN resources, placeholders, and regression tests
        run: |
          python3 tools/check_zh_localization.py --project .
          python3 -m unittest discover -s tests -p 'test_zh_localization.py'

      - name: Run Android and API unit tests
        working-directory: base
        run: ./gradlew testDebugUnitTest :api:test :api-spotify:test :host-cdp:test

      - name: Build the installable Chinese debug-preview APK
        working-directory: base
        run: |
          ./gradlew assembleDebug -PappVersionName=2.0.2-beta.3-zh.1 -PappVersionCode=2020301
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp base/app/build/outputs/apk/debug/app-debug.apk release-output/myspoti-2.0.2-beta.3-zh.1-android-debug.apk
          (cd release-output && sha256sum *.apk > SHA256SUMS.txt)
          cat release-output/SHA256SUMS.txt

      - name: Publish public GitHub Release with an actual APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v2.0.2-beta.3-zh.1"
          APK="release-output/myspoti-2.0.2-beta.3-zh.1-android-debug.apk"
          NOTES="docs/releases/v2.0.2-beta.3-zh.1.md"
          test -s "$APK" && test -s "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; updating assets and notes for the same Chinese preview tag."
            gh release upload "$TAG" "$APK" release-output/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file "$NOTES" --title "Myspoti 2.0.2-beta.3 简体中文体验版" --prerelease
          else
            gh release create "$TAG" "$APK" release-output/SHA256SUMS.txt               --target "$CHINESE_SOURCE_SHA"               --title "Myspoti 2.0.2-beta.3 简体中文体验版"               --notes-file "$NOTES"               --prerelease
          fi

      - name: Show download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v2.0.2-beta.3-zh.1 --json url,assets --jq '.url, (.assets[].name)'
